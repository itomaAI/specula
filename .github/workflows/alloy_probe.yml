# 一時的な試し（M3 の項目 8 の前に Alloy 6.2.0 の CLI を確かめる）。確かめたら消す。
# 2 回目: 反例が無いとき・あふれ・誤りのときの出力と終了コード、ソルバの名前、版。
name: Alloy probe

on:
  push:
    branches: [feat/m3]

env:
  ALLOY_URL: https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: download jar
        run: |
          curl -fsSL -o alloy.jar "$ALLOY_URL"
          echo "$ALLOY_SHA256  alloy.jar" | sha256sum -c -
      - name: version and solvers
        run: |
          set +e
          java -jar alloy.jar version; echo "exit=$?"
          java -jar alloy.jar solvers; echo "exit=$?"
      - name: models
        run: |
          cat > base.als <<'EOF'
          abstract sig Bool {}
          one sig True, False extends Bool {}
          one sig System { var v1: one Bool }
          fact Init { System.v1 = False }
          pred flip { System.v1 = False and System.v1' = True }
          pred stutter { System.v1' = System.v1 }
          fact Steps { always (flip or stutter) }
          pred flip_guard { System.v1 = False }
          check m3_holds { always (System.v1 = True implies after System.v1 = True) } for 3 but 4 Int, 1..3 steps
          check m3_cover { always (flip_guard) } for 3 but 4 Int, 1..3 steps
          run m3_never { eventually (System.v1 = True and flip) } for 3 but 4 Int, 1..3 steps
          EOF
          cat > overflow.als <<'EOF'
          one sig C { var n: one Int }
          fact Init { C.n = 7 }
          pred inc { C.n' = plus[C.n, 1] }
          pred stutter { C.n' = C.n }
          fact Steps { always (inc or stutter) }
          run m3_wrap { eventually C.n < 0 } for 3 but 4 Int, 1..3 steps
          EOF
          cat > syntax.als <<'EOF'
          one sig System { var v1: one Int
          run m3_x { } for 3
          EOF
          cat > typeerr.als <<'EOF'
          one sig System { var v1: one Int }
          run m3_x { no_such_pred } for 3
          EOF
      - name: unsat check (one command)
        run: |
          set +e
          java -jar alloy.jar exec -f -q -c m3_holds -o out_holds -t json base.als; echo "exit=$?"
          ls -la out_holds
          for f in out_holds/*; do echo "=== $f"; head -c 3000 "$f"; echo; done
      - name: unsat run
        run: |
          set +e
          java -jar alloy.jar exec -f -q -c m3_never -o out_never -t json base.als; echo "exit=$?"
          ls -la out_never
          for f in out_never/*; do echo "=== $f"; head -c 3000 "$f"; echo; done
      - name: sat check to stdout and as text
        run: |
          set +e
          echo "--- json to stdout"
          java -jar alloy.jar exec -q -c m3_cover -o - -t json base.als; echo "exit=$?"
          echo "--- text to stdout"
          java -jar alloy.jar exec -q -c m3_cover -o - -t text base.als; echo "exit=$?"
      - name: overflow with and without -n
        run: |
          set +e
          echo "--- without -n"
          java -jar alloy.jar exec -q -c m3_wrap -o - -t json overflow.als; echo "exit=$?"
          echo "--- with -n"
          java -jar alloy.jar exec -q -n -c m3_wrap -o - -t json overflow.als; echo "exit=$?"
      - name: errors
        run: |
          set +e
          echo "--- syntax"
          java -jar alloy.jar exec -f -q -o out_syntax -t json syntax.als; echo "exit=$?"
          ls -la out_syntax 2>&1
          echo "--- type"
          java -jar alloy.jar exec -f -q -o out_type -t json typeerr.als; echo "exit=$?"
          ls -la out_type 2>&1
          echo "--- unknown command name"
          java -jar alloy.jar exec -f -q -c no_such_cmd -o out_nocmd -t json base.als; echo "exit=$?"
          ls -la out_nocmd 2>&1
          echo "--- unknown solver"
          java -jar alloy.jar exec -f -q -s no_such_solver -c m3_cover -o out_nosolver -t json base.als; echo "exit=$?"