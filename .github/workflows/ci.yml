name: CI

on:
  push:
  pull_request:

env:
  # M3 の結合テストに使う Alloy（版と SHA-256 を固定する。M3 の設計 3.3）
  ALLOY_URL: https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
  ALLOY_SHA256: 6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Alloy 6.2.0 を取って SHA-256 を照合する
        run: |
          mkdir -p "$RUNNER_TEMP/alloy"
          curl -fsSL -o "$RUNNER_TEMP/alloy/alloy.jar" "$ALLOY_URL"
          echo "$ALLOY_SHA256  $RUNNER_TEMP/alloy/alloy.jar" | sha256sum -c -
          echo "ALLOY_JAR=$RUNNER_TEMP/alloy/alloy.jar" >> "$GITHUB_ENV"
      # lockfile はまだ無いので npm install で入れる（lockfile を足したら npm ci にする）
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # specula 自身にかける（全体設計 4.1）。結果を見るための段で、報告の中身では落とさない（合否の基準はまだ無い）。
      # 落ちるのは環境の故障（終了コード 1）と引数の誤り（2）のときだけ。
      - name: specula 自身にかける
        run: node dist/src/cli.js . --out "$RUNNER_TEMP/self" --alloy-jar "$ALLOY_JAR"
      - name: 実行の報告の合計を Step Summary に書く
        run: |
          {
            echo "## specula 自身にかけた結果（totals）"
            echo ""
            echo '```json'
            node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify(r.totals, null, 2));' "$RUNNER_TEMP/self/run_report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 出力一式を成果物として残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: specula-self
          path: ${{ runner.temp }}/self
          if-no-files-found: warn
      - run: npm run build:itera
      # Itera OS（ブラウザ）では node: のモジュールを読めない。bundle に静的な import が残っていたら落とす。
      - name: bundle に node: の静的な import が無いことを確かめる
        run: |
          if grep -nE '^import .* from "node:' dist/specula.itera.js; then
            echo "dist/specula.itera.js に node: の静的な import がある" >&2
            exit 1
          fi
      - name: Itera OS 版（bundle と起動アプリ）を成果物として残す
        uses: actions/upload-artifact@v4
        with:
          name: specula-itera
          path: |
            dist/specula.itera.js
            itera/specula.html
          if-no-files-found: error